    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42458A"/><stop offset="1" stop-color="#6F79BD"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DBE2E9" stroke-opacity=".14"/></pattern>
  </defs>
  <rect width="800" height="420" rx="24" fill="url(#bg)"/>
