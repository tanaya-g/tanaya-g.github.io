  <g fill="#B565A7" stroke="#F8F9FC" stroke-width="4"><circle cx="116" cy="263" r="12"/><circle cx="240" cy="287" r="12"/><circle cx="354" cy="201" r="12"/><circle cx="512" cy="139" r="12"/><circle cx="681" cy="179" r="12"/></g>
